name: "Bandolo Sync (daily)"

on:
  schedule:
    # Ogni giorno alle 06:00 UTC (08:00 ora italiana)
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Sync mode"
        required: true
        default: "incremental"
        type: choice
        options:
          - incremental
          - full

jobs:
  sync:
    name: "Sync Bandolo tenders"
    runs-on: ubuntu-latest
    timeout-minutes: 120  # max 2h per full sync (~30K bandi)
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Bandolo sync
        run: |
          if [ "${{ github.event.inputs.mode }}" = "full" ]; then
            echo "🔄 Running FULL sync..."
            node scripts/sync-bandolo.mjs --full
          else
            echo "🔄 Running INCREMENTAL sync..."
            node scripts/sync-bandolo.mjs
          fi

      - name: Show sync state
        if: always()
        run: |
          if [ -f .bandolo-sync-state.json ]; then
            echo "📊 Sync state:"
            cat .bandolo-sync-state.json
          fi
