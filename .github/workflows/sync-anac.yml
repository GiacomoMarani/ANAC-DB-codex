name: Sync ANAC → Supabase

on:
  # Ogni 6 ore
  schedule:
    - cron: '0 */6 * * *'
  # Trigger manuale dalla tab Actions
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limite bandi (vuoto = tutti)'
        required: false
        default: ''
      query:
        description: 'Filtro testo (es. "scuola")'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run ANAC sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          if [ -n "${{ github.event.inputs.query }}" ]; then
            ARGS="$ARGS --query ${{ github.event.inputs.query }}"
          fi
          node sync-anac.mjs $ARGS
